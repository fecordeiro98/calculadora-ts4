<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de simoleons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <table>
            <tr>
                <td>Carreira:</td>
                <td><select name="" id="carreira">
                    <option value="seleci">Selecione</option>
                    <option value="advogd">Advogado</option>
                    <option value="agtfun">Agente funerário</option>
                    <option value="agtsec">Agente secreto</option>
                    <option value="asslrd">Assalariado</option>
                    <option value="astrnt">Astronauta</option>
                    <option value="atleta">Atleta</option>
                    <option value="cienti">Cientista</option>
                    <option value="conser">Conservacionista</option>
                    <option value="crimns">Criminoso</option>
                    <option value="critic">Crítico</option>
                    <option value="culinr">Culinária</option>
                    <option value="detetv">Detetive</option>
                    <option value="educad">Educador</option>
                    <option value="engenh">Engenheiro</option>
                    <option value="entret">Entretenimento</option>
                    <option value="escrtr">Escritor</option>
                    <option value="groman">Guia de romance</option>
                    <option value="gurute">Guru da tecnologia</option>
                    <option value="influe">Influenciador de estilos</option>
                    <option value="jardin">Jardineiro</option>
                    <option value="medico">Médico</option>
                    <option value="msocia">Mídias sociais</option>
                    <option value="militr">Militar</option>
                    <option value="negocs">Negócios</option>
                    <option value="pintor">Pintor</option>
                    <option value="politi">Política</option>
                    <option value="prcivi">Projetista civil</option>
                </select></td>
            </tr>
            <tr>
                <td>Ramo:</td>
                <td><select name="" id="ramo">
                    <!-- Preenchido com JavaScript -->
                </select></td>
            </tr>
            <tr>
                <td>Cargo:</td>
                <td><select name="" id="cargo">
                    <!-- Preenchido com JavaScript -->
                </select></td>
            </tr>
            <tr class="separador">
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>C.H./dia:</td>
                <td><input type="number" name="" id="ch" disabled></td>
            </tr>
            <tr>
                <td>Valor/hora:</td>
                <td><input type="number" name="" id="valor-hor" disabled></td>
            </tr>
            <tr>
                <td>Dias/semana:</td>
                <td><input type="number" name="" id="dias" disabled></td>
            </tr>
            <tr class="separador">
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>Valor/dia:</td>
                <td><input type="number" name="" id="valor-dia" disabled></td>
            </tr>
            <tr>
                <td>Valor/semana:</td>
                <td><input type="number" name="" id="valor-sem" disabled></td>
            </tr>
            <tr class="separador">
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>Gastos fixos:</td>
                <td><input type="number" name="" id="gastos" min="0" step="1" value="0"></td>
            </tr>
            <tr>
                <td>Lucro:</td>
                <td><input type="number" name="" id="lucro" disabled></td>
            </tr>
            <tr>
                <td></td>
                <td><button id="calcular">Calcular</button></td>
            </tr>
        </table>
    </main>
    <footer>
        <span>&copy; Felipe Cordeiro</span><br>
        <span>Junho de 2024</span><br>
        <span>Atualizado até 24 de março de 2025</span><br>
        <span>v 1.1</span>
    </footer>
    <script src="script.js"></script>
</body>
</html>
